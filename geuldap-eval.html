<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글답 글쓰기 성장 관리 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f0f2f5; color: #1a1a2e; }

    .pw-screen { position: fixed; inset: 0; z-index: 9999; background: linear-gradient(160deg, #0d1b4b, #1a2f6b); display: flex; align-items: center; justify-content: center; }
    .pw-box { background: #fff; border-radius: 20px; padding: 48px 40px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .pw-logo { font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 700; color: #0d1b4b; margin-bottom: 6px; }
    .pw-logo span { color: #c5a149; }
    .pw-sub { font-size: 13px; color: #888; margin-bottom: 32px; }
    .pw-label { font-size: 14px; font-weight: 600; color: #555; margin-bottom: 8px; text-align: left; }
    .pw-input { width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 20px; outline: none; text-align: center; letter-spacing: 6px; transition: border 0.2s; }
    .pw-input:focus { border-color: #c5a149; }
    .pw-btn { width: 100%; margin-top: 16px; padding: 14px; background: linear-gradient(135deg, #c5a149, #e8c96a); color: #0d1b4b; font-weight: 700; font-size: 15px; border: none; border-radius: 10px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
    .pw-error { color: #e53e3e; font-size: 13px; margin-top: 10px; display: none; }
    .pw-error.show { display: block; }

    .header { background: linear-gradient(135deg, #0d1b4b, #1a2f6b); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: #fff; }
    .header-title span { color: #e8c96a; }
    .header-sub { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }
    .tab-nav { background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; padding: 0 32px; }
    .tab { padding: 14px 20px; font-size: 14px; font-weight: 600; color: #888; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab.active { color: #0d1b4b; border-bottom-color: #c5a149; }
    .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
    .card { background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card-title { font-size: 16px; font-weight: 700; color: #0d1b4b; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .card-title::before { content: ''; width: 4px; height: 18px; background: #c5a149; border-radius: 2px; display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1/-1; }
    label { font-size: 13px; font-weight: 600; color: #555; }
    input, select, textarea { padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; transition: border 0.2s; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #c5a149; }
    textarea { resize: vertical; min-height: 80px; }
    .btn { padding: 11px 24px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif; }
    .btn-primary { background: linear-gradient(135deg, #c5a149, #e8c96a); color: #0d1b4b; }
    .btn-secondary { background: #f0f2f5; color: #555; }
    .btn-danger { background: #fff0f0; color: #e53e3e; border: 1px solid #fecaca; }
    .btn-sm { padding: 6px 14px; font-size: 12px; }
    .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .student-card { background: #f8f9fc; border: 1.5px solid #e8e0cc; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; }
    .student-card:hover, .student-card.selected { border-color: #c5a149; background: #fefbf3; }
    .student-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #0d1b4b, #1a2f6b); color: #e8c96a; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .student-name { font-size: 15px; font-weight: 700; color: #0d1b4b; }
    .student-info { font-size: 12px; color: #888; margin-top: 3px; }
    .student-count { font-size: 11px; color: #c5a149; font-weight: 600; margin-top: 6px; }
    .upload-area { border: 2px dashed #c5a149; border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; background: #fefbf3; }
    .preview-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 16px; }
    .thumb-wrap { position: relative; width: 90px; height: 90px; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .thumb-remove { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #d9534f; color: #fff; border: none; font-size: 13px; line-height: 22px; cursor: pointer; padding: 0; }
    .thumb-num { position: absolute; bottom: 2px; left: 2px; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; padding: 1px 5px; border-radius: 4px; }
    .eval-header { background: linear-gradient(135deg, #0d1b4b, #1a2f6b); border-radius: 12px; padding: 24px; color: #fff; margin-bottom: 20px; }
    .eval-student { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
    .eval-title { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 700; color: #e8c96a; margin-bottom: 8px; }
    .eval-date { font-size: 12px; color: rgba(255,255,255,0.5); }
    .eval-total { font-size: 36px; font-weight: 700; color: #e8c96a; margin-top: 12px; }
    .eval-total span { font-size: 16px; color: rgba(255,255,255,0.6); }
    .score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .score-item { background: #f8f9fc; border-radius: 10px; padding: 14px; text-align: center; }
    .score-label { font-size: 12px; color: #888; margin-bottom: 6px; }
    .score-value { font-size: 24px; font-weight: 700; }
    .score-value.high { color: #2f855a; }
    .score-value.mid { color: #c5a149; }
    .score-value.low { color: #e53e3e; }
    .score-bar { height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 8px; }
    .score-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #c5a149, #e8c96a); }
    .eval-text { font-size: 14px; color: #444; line-height: 1.75; background: #f8f9fc; border-radius: 8px; padding: 14px; }
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .compare-card { border-radius: 10px; padding: 16px; }
    .compare-card.good { background: #f0fff4; border: 1px solid #c6f6d5; }
    .compare-card.bad { background: #fff5f5; border: 1px solid #fed7d7; }
    .compare-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
    .compare-title.good { color: #2f855a; }
    .compare-title.bad { color: #c53030; }
    .compare-item { font-size: 13px; color: #555; margin-bottom: 6px; line-height: 1.5; }
    .record-item { background: #f8f9fc; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
    .record-item:hover { border-color: #c5a149; background: #fefbf3; }
    .record-date { font-size: 12px; color: #888; min-width: 90px; }
    .record-title { font-size: 14px; font-weight: 600; color: #0d1b4b; flex: 1; }
    .record-score { font-size: 20px; font-weight: 700; color: #c5a149; min-width: 50px; text-align: right; }
    .record-change.up { color: #2f855a; font-size:12px; font-weight:600; }
    .record-change.down { color: #e53e3e; font-size:12px; font-weight:600; }
    .loading { display: none; text-align: center; padding: 40px; }
    .loading.show { display: block; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #c5a149; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page { display: none; }
    .page.active { display: block; }
    .empty { text-align: center; padding: 48px; color: #aaa; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 90%; max-width: 500px; }
    .modal-title { font-size: 18px; font-weight: 700; color: #0d1b4b; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    @media (max-width: 768px) {
      .score-grid { grid-template-columns: repeat(2, 1fr); }
      .compare-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div class="pw-screen" id="pwScreen">
  <div class="pw-box">
    <div class="pw-logo">글답 <span>관리자</span></div>
    <div class="pw-sub">글쓰기 성장 관리 시스템</div>
    <div class="pw-label">비밀번호를 입력하세요</div>
    <input class="pw-input" type="password" id="pwInput" placeholder="●●●●" onkeydown="if(event.key==='Enter') checkPw()">
    <button class="pw-btn" onclick="checkPw()">🔐 로그인</button>
    <div class="pw-error" id="pwError">비밀번호가 올바르지 않습니다</div>
  </div>
</div>

<!-- 헤더 -->
<div class="header">
  <div>
    <div class="header-title">글답 <span>글쓰기 성장</span> 관리 시스템</div>
    <div class="header-sub">AI 기반 학생 글쓰기 평가 · 성장 추적</div>
  </div>
  <button class="btn btn-primary" onclick="openModal()">+ 학생 등록</button>
</div>

<!-- 탭 -->
<div class="tab-nav">
  <div class="tab active" onclick="switchTab('students')">학생 관리</div>
  <div class="tab" onclick="switchTab('upload')">글 업로드 · 평가</div>
  <div class="tab" onclick="switchTab('records')">평가 기록</div>
</div>

<div class="main">
  <!-- 학생 관리 -->
  <div class="page active" id="page-students">
    <div class="card">
      <div class="card-title">등록된 학생</div>
      <div class="student-grid" id="studentGrid"></div>
    </div>
  </div>

  <!-- 업로드 -->
  <div class="page" id="page-upload">
    <div class="card">
      <div class="card-title">학생 선택</div>
      <div class="student-grid" id="uploadStudentGrid"></div>
    </div>
    <div class="card" id="uploadSection" style="display:none;">
      <div class="card-title">글 정보 입력</div>
      <div class="form-grid">
        <div class="form-group">
          <label>작성 날짜 (과거 글이면 실제 날짜 입력)</label>
          <input type="date" id="writingDate">
        </div>
        <div class="form-group">
          <label>글 종류</label>
          <select id="writingType">
            <option>독후감</option>
            <option>주제글쓰기</option>
            <option>논술</option>
            <option>수행평가</option>
            <option>자유글쓰기</option>
          </select>
        </div>
        <div class="form-group full">
          <label>참고 도서/주제 (선택)</label>
          <input type="text" id="writingTopic" placeholder="예) 잘못 뽑은 반장, 새벽">
        </div>
        <div class="form-group full">
          <label>사진 업로드 (여러 장 가능)</label>
          <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size:36px; margin-bottom:10px;">📸</div>
            <div style="font-size:14px; color:#888;"><strong>클릭하여 사진 선택</strong><br>학생이 쓴 글 사진을 여러 장 올릴 수 있어요 (여러 페이지)</div>
            <div id="previewList" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; justify-content:center;"></div>
          </div>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" onchange="previewImage(this)">
        </div>
        <div class="form-group full">
          <label>글 내용</label>
          <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:#666; font-weight:normal; margin-bottom:6px;">
            <input type="checkbox" id="isManuscript" style="width:auto;">
            원고지(칸이 있는 용지)로 촬영했어요 — 체크하면 AI가 더 정확하게 읽어요 (약간의 비용 발생)
          </label>
          <textarea id="writingContent" rows="8" placeholder="사진에서 자동으로 추출하거나 직접 입력하세요..."></textarea>
          <button class="btn btn-secondary btn-sm" style="margin-top:8px;width:fit-content;" onclick="extractFromImage()">📷 사진에서 글 추출</button>
        </div>
      </div>
      <div style="margin-top:20px;">
        <button class="btn btn-primary" onclick="evaluateWriting()">🤖 AI 평가 시작</button>
      </div>
    </div>
    <div class="loading" id="loadingSection">
      <div class="spinner"></div>
      <div id="loadingText" style="font-size:14px;color:#888;">AI가 분석 중입니다...</div>
    </div>
    <div id="evalResult" style="display:none;">
      <div class="eval-header" id="evalHeader"></div>
      <div class="card"><div class="card-title">항목별 점수</div><div class="score-grid" id="scoreGrid"></div></div>
      <div class="card"><div class="card-title">종합 평가</div><div id="evalSummary"></div></div>
      <div class="card"><div class="card-title">이전 글과 비교</div><div id="evalCompare"></div></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:20px;">
        <button class="btn btn-secondary" onclick="resetUpload()">새 글 평가</button>
        <button class="btn btn-primary" onclick="saveRecord()">💾 기록 저장</button>
      </div>
    </div>
  </div>

  <!-- 기록 -->
  <div class="page" id="page-records">
    <div class="card">
      <div class="card-title">학생 선택</div>
      <div class="student-grid" id="recordStudentGrid"></div>
    </div>
    <div class="card" id="recordListSection" style="display:none;">
      <div class="card-title" id="recordListTitle">평가 기록</div>
      <div id="recordList"></div>
    </div>
  </div>
</div>

<!-- 학생 등록 모달 -->
<div class="modal-bg" id="studentModal">
  <div class="modal">
    <div class="modal-title" id="studentModalTitle">학생 등록</div>
    <div class="form-grid">
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="newName" placeholder="홍길동">
      </div>
      <div class="form-group">
        <label>학년</label>
        <select id="newGrade">
          <option>초등 3학년</option><option>초등 4학년</option><option>초등 5학년</option>
          <option>초등 6학년</option><option>중학교 1학년</option><option>중학교 2학년</option><option>중학교 3학년</option>
        </select>
      </div>
      <div class="form-group full">
        <label>입학일</label>
        <input type="date" id="newDate">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="studentModalSaveBtn" onclick="saveStudent()">등록</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const app = initializeApp({
    apiKey: "AIzaSyC5nf84GbQQ_5vIDwhIvTZ5zPqf7nrnSxU",
    authDomain: "starspoon-120d7.firebaseapp.com",
    projectId: "starspoon-120d7",
    storageBucket: "starspoon-120d7.firebasestorage.app",
    messagingSenderId: "672370227821",
    appId: "1:672370227821:web:aea1d9c6ca8587842a5d64"
  });
  const db = getFirestore(app);
  window._db = db;
  window._col = collection;
  window._add = addDoc;
  window._get = getDocs;
  window._q = query;
  window._where = where;
  window._del = deleteDoc;
  window._doc = doc;
  window._update = updateDoc;

  // Firestore 문서의 자동 ID와 우리가 쓰는 데이터의 id가 달라서,
  // 'id' 필드로 찾아서 지우거나 수정하는 헬퍼.
  window._deleteByFieldId = async function(collName, id) {
    const q = query(collection(db, collName), where('id', '==', id));
    const snap = await getDocs(q);
    const jobs = [];
    snap.forEach(d => jobs.push(deleteDoc(d.ref)));
    await Promise.all(jobs);
  };
  window._updateByFieldId = async function(collName, id, data) {
    const q = query(collection(db, collName), where('id', '==', id));
    const snap = await getDocs(q);
    const jobs = [];
    snap.forEach(d => jobs.push(updateDoc(d.ref, data)));
    await Promise.all(jobs);
  };

  // Firebase에서 데이터 로드
  try {
    const ss = await getDocs(collection(db, 'geuldap_students'));
    ss.forEach(d => { const s = d.data(); if (!window._students.find(x=>x.id===s.id)) window._students.push(s); });
    const rs = await getDocs(collection(db, 'geuldap_records'));
    rs.forEach(d => { const r = d.data(); if (!window._records.find(x=>x.id===r.id)) window._records.push(r); });
    localStorage.setItem('gs', JSON.stringify(window._students));
    localStorage.setItem('gr', JSON.stringify(window._records));
  } catch(e) { console.log('Firebase 로드:', e); }
  renderStudents();
  window._fbReady = true;
</script>

<script>
  // ===== 비밀번호 =====
  function checkPw() {
    if (document.getElementById('pwInput').value === '0147') {
      document.getElementById('pwScreen').style.display = 'none';
      sessionStorage.setItem('auth','1');
    } else {
      document.getElementById('pwError').classList.add('show');
      document.getElementById('pwInput').value = '';
    }
  }
  if (sessionStorage.getItem('auth') === '1') {
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('pwScreen').style.display = 'none';
    });
  }

  // ===== 상태 =====
  window._students = JSON.parse(localStorage.getItem('gs') || '[]');
  window._records = JSON.parse(localStorage.getItem('gr') || '[]');
  let selectedStudent = null;
  let currentEval = null;

  // ===== 초기화 =====
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('newDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('writingDate').value = new Date().toISOString().split('T')[0];
    renderStudents();
  });

  // ===== 탭 =====
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['students','upload','records'][i]===tab));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-'+tab).classList.add('active');
    if (tab==='upload') renderUploadStudents();
    if (tab==='records') renderRecordStudents();
  }

  // ===== 렌더링 =====
  function renderStudents() {
    const g = document.getElementById('studentGrid');
    if (!g) return;
    if (_students.length===0) { g.innerHTML='<div class="empty"><div class="empty-icon">👦</div><div>등록된 학생이 없습니다<br>+ 학생 등록 버튼을 눌러주세요</div></div>'; return; }
    g.innerHTML = _students.map(s => {
      const cnt = _records.filter(r=>r.studentId===s.id).length;
      return `<div class="student-card">
        <div class="student-avatar">${s.name[0]}</div>
        <div class="student-name">${s.name}</div>
        <div class="student-info">${s.grade} · ${s.date}</div>
        <div class="student-count">📝 ${cnt}편</div>
        <div style="margin-top:10px; display:flex; gap:6px; justify-content:center;">
          <button class="btn btn-secondary btn-sm" onclick="editStudent('${s.id}')">수정</button>
          <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">삭제</button>
        </div>
      </div>`;
    }).join('');
  }

  function renderUploadStudents() {
    const g = document.getElementById('uploadStudentGrid');
    if (_students.length===0) { g.innerHTML='<div class="empty"><div class="empty-icon">👦</div><div>먼저 학생을 등록해주세요</div></div>'; return; }
    g.innerHTML = _students.map(s=>`<div class="student-card ${selectedStudent?.id===s.id?'selected':''}" onclick="selectStudent('${s.id}')">
      <div class="student-avatar">${s.name[0]}</div>
      <div class="student-name">${s.name}</div>
      <div class="student-info">${s.grade}</div>
    </div>`).join('');
  }

  function renderRecordStudents() {
    const g = document.getElementById('recordStudentGrid');
    if (_students.length===0) { g.innerHTML='<div class="empty"><div class="empty-icon">👦</div><div>등록된 학생이 없습니다</div></div>'; return; }
    g.innerHTML = _students.map(s=>{
      const cnt = _records.filter(r=>r.studentId===s.id).length;
      return `<div class="student-card" onclick="showRecords('${s.id}')">
        <div class="student-avatar">${s.name[0]}</div>
        <div class="student-name">${s.name}</div>
        <div class="student-info">${s.grade}</div>
        <div class="student-count">📝 ${cnt}편</div>
      </div>`;
    }).join('');
  }

  // ===== 모달 =====
  let editingStudentId = null;
  function openModal() {
    editingStudentId = null;
    document.getElementById('studentModalTitle').textContent = '학생 등록';
    document.getElementById('studentModalSaveBtn').textContent = '등록';
    document.getElementById('newName').value = '';
    document.getElementById('newGrade').selectedIndex = 0;
    document.getElementById('newDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('studentModal').classList.add('open');
  }
  function closeModal() { document.getElementById('studentModal').classList.remove('open'); }

  // ===== 학생 수정 시작 =====
  function editStudent(id) {
    const s = _students.find(x=>x.id===id);
    if (!s) return;
    editingStudentId = id;
    document.getElementById('studentModalTitle').textContent = '학생 정보 수정';
    document.getElementById('studentModalSaveBtn').textContent = '저장';
    document.getElementById('newName').value = s.name;
    document.getElementById('newGrade').value = s.grade;
    document.getElementById('newDate').value = s.date;
    document.getElementById('studentModal').classList.add('open');
  }

  // ===== 학생 추가/수정 저장 =====
  async function saveStudent() {
    const name = document.getElementById('newName').value.trim();
    const grade = document.getElementById('newGrade').value;
    const date = document.getElementById('newDate').value;
    if (!name) { alert('이름을 입력해주세요'); return; }

    if (editingStudentId) {
      const idx = _students.findIndex(s=>s.id===editingStudentId);
      if (idx > -1) {
        _students[idx] = { ..._students[idx], name, grade, date };
        localStorage.setItem('gs', JSON.stringify(_students));
        if (window._fbReady) {
          window._updateByFieldId('geuldap_students', editingStudentId, { name, grade, date }).catch(console.error);
        }
      }
    } else {
      const s = { id: Date.now().toString(), name, grade, date };
      _students.push(s);
      localStorage.setItem('gs', JSON.stringify(_students));
      if (window._fbReady) window._add(window._col(window._db,'geuldap_students'), s).catch(console.error);
    }
    closeModal();
    renderStudents();
  }

  // ===== 학생 삭제 =====
  async function deleteStudent(id) {
    if (!confirm('삭제할까요?')) return;
    window._students = _students.filter(s=>s.id!==id);
    window._records = _records.filter(r=>r.studentId!==id);
    localStorage.setItem('gs', JSON.stringify(_students));
    localStorage.setItem('gr', JSON.stringify(_records));
    renderStudents();
    if (window._fbReady) {
      try {
        await window._deleteByFieldId('geuldap_students', id);
        const q = window._q(window._col(window._db,'geuldap_records'), window._where('studentId','==', id));
        const snap = await window._get(q);
        const jobs = [];
        snap.forEach(d => jobs.push(window._del(d.ref)));
        await Promise.all(jobs);
      } catch(e) { console.error('클라우드 삭제 오류:', e); }
    }
  }

  // ===== 학생 선택 =====
  function selectStudent(id) {
    selectedStudent = _students.find(s=>s.id===id);
    renderUploadStudents();
    document.getElementById('uploadSection').style.display='block';
    document.getElementById('evalResult').style.display='none';
  }

  // ===== 이미지 미리보기 (여러 장) =====
  let uploadedImages = []; // { base64, dataUrl }

  // 아이폰 사진 등은 실제 픽셀은 회전된 채 저장되고 "화면에 보일 때 돌려서 보여줘"라는
  // 방향 정보(EXIF)만 따로 붙어있는 경우가 많다. Vision API로 원본 그대로 보내면
  // 글자가 옆으로 누운 채로 인식되어 엉뚱한 글자를 뱉어낸다.
  // 캔버스에 방향을 반영해서 다시 그린 뒤 전송하면 이 문제가 해결된다.
  // 원고지 칸선은 대개 붉은/분홍 계열이고, 글씨는 회색(무채색) 연필이다.
  // 붉은기가 도는 픽셀은 흰색으로 날려서 칸선을 지우고 글씨만 남긴다.
  function suppressGridLines(canvas) {
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2];
      const redness = r - (g + b) / 2;
      let gray = (r + g + b) / 3;
      if (redness > 12) gray = 255; // 붉은 계열(칸선)은 흰색 처리
      d[i] = d[i+1] = d[i+2] = gray;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  async function loadOrientedImage(file) {
    try {
      const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const MAX_DIM = 2200;
      let { width, height } = bitmap;
      if (width > MAX_DIM || height > MAX_DIM) {
        const scale = MAX_DIM / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
      suppressGridLines(canvas);
      return canvas.toDataURL('image/jpeg', 0.92);
    } catch (e) {
      // 구형 브라우저 등에서 위 방식이 안 되면 원본 그대로 사용
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => resolve(ev.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
  }

  async function previewImage(input) {
    const files = Array.from(input.files || []);
    if (!files.length) return;
    for (const file of files) {
      try {
        const dataUrl = await loadOrientedImage(file);
        uploadedImages.push({ base64: dataUrl.split(',')[1], dataUrl });
        renderPreviewList();
      } catch (e) {
        alert('사진 처리 중 오류: ' + e.message);
      }
    }
    input.value = ''; // 같은 파일 다시 선택 가능하도록 초기화
  }

  function renderPreviewList() {
    const list = document.getElementById('previewList');
    list.innerHTML = uploadedImages.map((img, i) => `
      <div class="thumb-wrap" onclick="event.stopPropagation()">
        <img src="${img.dataUrl}">
        <span class="thumb-num">${i+1}</span>
        <button class="thumb-remove" onclick="event.stopPropagation(); removeImage(${i})">✕</button>
      </div>
    `).join('');
  }

  function removeImage(i) {
    uploadedImages.splice(i, 1);
    renderPreviewList();
  }

  // ===== 글 추출 =====
  // 일반 노트/편지지: Google Vision (무료/저렴, 빠름)
  // 원고지(칸 있는 용지): Claude Vision (칸선/좁은 글자 배치에 훨씬 강함, 약간의 비용)
  const GOOGLE_VISION_API_KEY = 'AIzaSyCTpggLimhoo_jWyJQPf7mbTovtO7lABdQ';

  // 원고지처럼 Vision이 한 글자/단어씩 줄바꿈해버리는 문제를 보정.
  // 글자 단위의 detectedBreak 정보를 이용해 띄어쓰기/줄바꿈을 다시 판단해서 문장을 이어붙인다.
  function reconstructText(response) {
    const pages = response?.fullTextAnnotation?.pages;
    if (!pages || !pages.length) return response?.fullTextAnnotation?.text || '';
    let result = '';
    for (const page of pages) {
      for (const block of page.blocks || []) {
        for (const para of block.paragraphs || []) {
          for (const word of para.words || []) {
            for (const symbol of word.symbols || []) {
              result += symbol.text || '';
              const breakType = symbol.property?.detectedBreak?.type;
              if (breakType === 'SPACE' || breakType === 'SURE_SPACE') {
                result += ' ';
              } else if (breakType === 'EOL_SURE_SPACE' || breakType === 'LINE_BREAK') {
                result += '\n';
              }
            }
          }
          result += '\n';
        }
      }
    }
    return result.replace(/\n{3,}/g, '\n\n').trim();
  }

  async function extractWithGoogleVision(img, index) {
    const res = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_VISION_API_KEY}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ requests:[{
        image:{ content: img.base64 },
        features:[{ type:'DOCUMENT_TEXT_DETECTION' }],
        imageContext:{ languageHints:['ko'] }
      }]})
    });
    const data = await res.json();
    if (data.error) throw new Error(`(사진 ${index+1}) ` + data.error.message);
    return reconstructText(data.responses?.[0]);
  }

  async function extractWithClaudeVision(img, index) {
    const prompt = '이 사진은 학생이 원고지 또는 노트에 손으로 쓴 글입니다. 사진 속 글자를 빠짐없이 정확하게 그대로 옮겨 적어주세요. 원고지의 칸 구분이나 교정부호, 페이지 번호 같은 것은 무시하고, 실제로 학생이 쓴 문장만 자연스럽게 이어서 작성하세요. 설명이나 사족 없이 옮겨 적은 글 내용만 출력하세요.';
    const res = await fetch(EVAL_FUNCTION_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ prompt, image: { data: img.base64, mediaType: 'image/jpeg' } })
    });
    const data = await res.json();
    if (!res.ok || data.error || !data.text) {
      throw new Error(`(사진 ${index+1}) ` + (data.error || `서버 오류 (status ${res.status})`));
    }
    return data.text.trim();
  }

  async function extractFromImage() {
    if (!uploadedImages.length) { alert('사진을 먼저 업로드해주세요'); return; }
    const isManuscript = document.getElementById('isManuscript').checked;
    setLoading(true, `사진 ${uploadedImages.length}장에서 글을 추출하고 있습니다...`);
    try {
      const texts = [];
      for (let i = 0; i < uploadedImages.length; i++) {
        setLoading(true, `사진 ${i+1}/${uploadedImages.length}에서 글을 추출하고 있습니다...`);
        const text = isManuscript
          ? await extractWithClaudeVision(uploadedImages[i], i)
          : await extractWithGoogleVision(uploadedImages[i], i);
        if (text) texts.push(text);
      }
      if (!texts.length) { alert('글자를 인식하지 못했습니다. 사진이 선명한지 확인해주세요.'); setLoading(false); return; }
      document.getElementById('writingContent').value = texts.join('\n\n');
    } catch(e) { alert('추출 오류: '+e.message); }
    setLoading(false);
  }

  // ===== AI 평가 (Firebase Function 경유) =====
  const EVAL_FUNCTION_URL = 'https://asia-northeast3-starspoon-120d7.cloudfunctions.net/evaluateWriting';

  async function evaluateWriting() {
    if (!selectedStudent) { alert('학생을 선택해주세요'); return; }
    const content = document.getElementById('writingContent').value.trim();
    if (!content) { alert('글 내용을 입력해주세요'); return; }
    const type = document.getElementById('writingType').value;
    const topic = document.getElementById('writingTopic').value;
    const dateVal = document.getElementById('writingDate').value;
    const prevRecs = _records.filter(r=>r.studentId===selectedStudent.id).slice(-3);
    const prevInfo = prevRecs.length>0 ? '이전 글: '+prevRecs.map(r=>`[${r.date}] ${r.totalScore}점`).join(', ') : '첫 번째 글';
    setLoading(true,'AI가 글을 분석하고 있습니다...');
    document.getElementById('evalResult').style.display='none';
    try {
      const prompt = `당신은 22년 경력의 국어 교사입니다. ${selectedStudent.grade} 학생의 ${type} 글을 냉정하고 전문적으로 평가해주세요.\n학생: ${selectedStudent.name} (${selectedStudent.grade})\n글 종류: ${type}${topic?'\n주제: '+topic:''}\n${prevInfo}\n\n[학생 글]\n${content}\n\n아래 JSON 형식으로만 응답하세요:\n{"title":"글 제목","scores":{"논리성":점수,"소재참신성":점수,"어휘풍부성":점수,"문장구성력":점수,"표현다양성":점수,"주제일관성":점수,"감수성창의성":점수,"맞춤법":점수},"strengths":["잘된 점1","잘된 점2","잘된 점3"],"improvements":["아쉬운 점1","아쉬운 점2"],"summary":"전체 총평 3-4문장","compare":"이전 글과 비교 또는 앞으로 방향","encouragement":"학생에게 한마디"}`;

      const res = await fetch(EVAL_FUNCTION_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      if (!res.ok || data.error || !data.text) {
        throw new Error(data.error || `서버 오류 (status ${res.status})`);
      }
      const text = data.text.replace(/```json|```/g,'').trim();
      currentEval = JSON.parse(text);
      currentEval.studentId = selectedStudent.id;
      currentEval.studentName = selectedStudent.name;
      currentEval.grade = selectedStudent.grade;
      currentEval.type = type;
      currentEval.topic = topic;
      currentEval.content = content;
      currentEval.date = dateVal ? new Date(dateVal).toLocaleDateString('ko-KR') : new Date().toLocaleDateString('ko-KR');
      currentEval.totalScore = Math.round(Object.values(currentEval.scores).reduce((a,b)=>a+b,0)/8*10)/10;
      renderEval();
    } catch(e) { alert('평가 오류: '+e.message); }
    setLoading(false);
  }

  // ===== 평가 렌더링 =====
  function renderEval() {
    const e = currentEval;
    document.getElementById('evalHeader').innerHTML=`<div class="eval-student">${e.studentName} · ${e.grade} · ${e.type}</div><div class="eval-title">${e.title}</div><div class="eval-date">${e.date}</div><div class="eval-total">${e.totalScore}<span> / 100점</span></div>`;
    const icons = {'논리성':'🧠','소재참신성':'✨','어휘풍부성':'📚','문장구성력':'✏️','표현다양성':'🎨','주제일관성':'🎯','감수성창의성':'💡','맞춤법':'🔤'};
    document.getElementById('scoreGrid').innerHTML = Object.entries(e.scores).map(([k,v])=>`<div class="score-item"><div class="score-label">${icons[k]||''} ${k}</div><div class="score-value ${v>=8?'high':v>=6?'mid':'low'}">${v}</div><div class="score-bar"><div class="score-bar-fill" style="width:${v*10}%"></div></div></div>`).join('');
    document.getElementById('evalSummary').innerHTML=`<div class="eval-text" style="margin-bottom:16px;">${e.summary}</div><div class="compare-grid"><div class="compare-card good"><div class="compare-title good">✅ 잘된 점</div>${e.strengths.map(s=>`<div class="compare-item">• ${s}</div>`).join('')}</div><div class="compare-card bad"><div class="compare-title bad">📌 보완할 점</div>${e.improvements.map(s=>`<div class="compare-item">• ${s}</div>`).join('')}</div></div><div class="eval-text" style="margin-top:16px;background:#fefbf3;border-left:3px solid #c5a149;padding-left:16px;">💬 ${e.encouragement}</div>`;
    document.getElementById('evalCompare').innerHTML=`<div class="eval-text">${e.compare}</div>`;
    document.getElementById('evalResult').style.display='block';
    document.getElementById('evalResult').scrollIntoView({behavior:'smooth'});
  }

  // ===== 저장 =====
  async function saveRecord() {
    if (!currentEval) return;
    const r = {...currentEval, id: Date.now().toString()};
    _records.push(r);
    localStorage.setItem('gr', JSON.stringify(_records));
    if (window._fbReady) await window._add(window._col(window._db,'geuldap_records'), r).catch(console.error);
    alert('저장되었습니다!');
    renderStudents();
  }

  // ===== 기록 보기 =====
  function showRecords(id) {
    const s = _students.find(x=>x.id===id);
    const recs = _records.filter(r=>r.studentId===id).reverse();
    document.getElementById('recordListSection').style.display='block';
    document.getElementById('recordListTitle').textContent=`${s.name} 평가 기록 (${recs.length}편)`;
    if (recs.length===0) { document.getElementById('recordList').innerHTML='<div class="empty"><div class="empty-icon">📝</div><div>아직 기록이 없습니다</div></div>'; return; }
    document.getElementById('recordList').innerHTML = recs.map((r,i)=>{
      const prev = recs[i+1];
      const diff = prev ? (r.totalScore-prev.totalScore).toFixed(1) : null;
      const ch = diff===null?'':(diff>0?`<span class="record-change up">▲${diff}</span>`:`<span class="record-change down">▼${Math.abs(diff)}</span>`);
      return `<div class="record-item"><div class="record-date">${r.date}</div><div><div class="record-title">${r.title}</div><div style="font-size:12px;color:#888;">${r.type}</div></div>${ch}<div class="record-score">${r.totalScore}</div></div>`;
    }).join('');
  }

  // ===== 리셋 =====
  function resetUpload() {
    document.getElementById('writingContent').value='';
    document.getElementById('writingTopic').value='';
    document.getElementById('fileInput').value='';
    document.getElementById('previewList').innerHTML='';
    document.getElementById('evalResult').style.display='none';
    uploadedImages=[]; currentEval=null;
    window.scrollTo(0,0);
  }

  // ===== 로딩 =====
  function setLoading(show, text) {
    document.getElementById('loadingSection').classList.toggle('show', show);
    if(text) document.getElementById('loadingText').textContent=text;
  }
</script>
